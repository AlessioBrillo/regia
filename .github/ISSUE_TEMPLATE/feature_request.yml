name: Feature request
description: Propose a capability tied to a vision requirement
labels: ["type/feature"]
body:
  - type: textarea
    id: need
    attributes: { label: Need, description: "Which user or system problem, and which requirement (AR-xx / module M-xx)?" }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria }
    validations: { required: true }
  - type: textarea
    id: risk
    attributes: { label: Security / privacy impact }
