name: Bug report
description: Something behaves differently from the documented contract
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: Use synthetic data only. Never paste real personal data. Security issues go through SECURITY.md.
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Expected vs actual." }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Minimal reproduction, description: "Commands, inputs, versions (OS, toolchain)." }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Commit or version }
