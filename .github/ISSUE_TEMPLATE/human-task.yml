name: Human task
description: Prova manuale o attività pratica delegata (vedi docs/handbook/)
labels: ["type/human-task"]
body:
  - type: input
    id: card
    attributes: { label: Task card ID, placeholder: "HT-01" }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - setup
        - prove dispositivi
        - test manuali
        - human eval
        - docs e G3
    validations: { required: true }
  - type: textarea
    id: goal
    attributes:
      label: Obiettivo e criteri di accettazione
      description: Copia dalla task card in docs/handbook/tasks/
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidenze da produrre
      description: Comandi, ripetizioni, RAW e posto di destinazione
    validations: { required: true }
  - type: textarea
    id: blockers
    attributes:
      label: Blocchi o dispositivi mancanti
      description: Segnala qui ciò che non è eseguibile, senza inventare un risultato
