[package]
name = "regia-domain"
description = "Regia domain core: typed IDs, confidentiality labels, server visibility and provenance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[features]
# Deterministic synthetic datasets and demo-only fingerprints. Off by default.
synthetic = ["dep:sha2", "dep:serde_json"]

[[example]]
name = "dat01"
required-features = ["synthetic"]

[[example]]
name = "capture"
required-features = ["synthetic"]

[[example]]
name = "query"
required-features = ["synthetic"]

[[example]]
name = "review"
required-features = ["synthetic"]

[[example]]
name = "act"
required-features = ["synthetic"]

[lints]
workspace = true
