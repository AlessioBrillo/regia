[graph]
all-features = true

[advisories]
version = 2
# Unmaintained (not vulnerable) with no safe upgrade; reached only through cedar-policy (ADR-005 trial) and the
# throwaway regorus spike. Revisit when cedar-policy or regorus drops chrono, or when a CVE is filed against it.
ignore = [
  "RUSTSEC-2026-0543", # chrono
  "RUSTSEC-2026-0555", # chrono-tz
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  # Permissive, added for the POL-01 spike dependencies (cedar-policy, regorus):
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "MIT-0",
  "Zlib",
  # Permissive, added for the AI-01 R4 adapter (ureq -> rustls, ring, webpki-roots):
  "ISC",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
